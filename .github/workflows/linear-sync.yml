name: Linear Sync

on:
  push:
    branches: [main]
    paths:
      # Only trigger on issues.jsonl changes — NOT external_refs.json.
      # This separation prevents the self-triggering loop.
      # See PLAN.md §5 "External_ref storage separation".
      - '.beads/issues.jsonl'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without pushing to Linear or git'
        type: boolean
        default: false
      max_delta:
        description: 'Override push-volume safety threshold'
        type: number
        default: 100

concurrency:
  group: linear-sync-${{ github.repository }}
  # Queue rather than cancel — every push should sync, ordering matters
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # git push external_refs.json back to main

    env:
      BD_VERSION: "v1.0.3"
      BD_REPO: "gastownhall/beads"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # SYNC_BOT_TOKEN is a PAT or GitHub App token. The default
          # GITHUB_TOKEN cannot trigger other workflows and may lack push
          # access with branch protection.
          token: ${{ secrets.SYNC_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "beads-sync-bot"
          git config user.email "beads-sync-bot@users.noreply.github.com"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install bd
        run: |
          echo "::group::Install bd from source"

          # Try binary release first, fall back to building from source.
          BD_BIN="/usr/local/bin/bd"

          # Attempt 1: download pre-built binary from GitHub releases
          RELEASE_URL="https://github.com/${BD_REPO}/releases/download/${BD_VERSION}/bd-linux-amd64"
          if curl -fsSL --connect-timeout 10 "$RELEASE_URL" -o "$BD_BIN" 2>/dev/null; then
            chmod +x "$BD_BIN"
            echo "Installed bd from release: $RELEASE_URL"
          else
            echo "No pre-built binary at $RELEASE_URL — building from source"

            # Attempt 2: build from source via go install
            git clone --depth 1 --branch "${BD_VERSION}" \
              "https://github.com/${BD_REPO}.git" /tmp/beads-src 2>/dev/null \
              || git clone --depth 1 "https://github.com/${BD_REPO}.git" /tmp/beads-src

            cd /tmp/beads-src
            go build -o "$BD_BIN" ./cmd/bd
            cd -
            rm -rf /tmp/beads-src
            echo "Built bd from source"
          fi

          bd --version
          echo "::endgroup::"

      - name: Install jq
        run: |
          if ! command -v jq &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Initialize beads database
        run: |
          # The CI worker starts fresh each run — no persistent state.
          # This is intentional: stateless reproducibility > incremental speed.
          if [[ ! -d .beads/embeddeddolt ]]; then
            bd init --force 2>/dev/null || true
          fi

      - name: Configure Linear integration
        env:
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          BD_LINEAR_STATE_OPEN: ${{ vars.BD_LINEAR_STATE_OPEN }}
          BD_LINEAR_STATE_IN_PROGRESS: ${{ vars.BD_LINEAR_STATE_IN_PROGRESS }}
          BD_LINEAR_STATE_CLOSED: ${{ vars.BD_LINEAR_STATE_CLOSED }}
        run: |
          # Wire non-secret Linear config into the fresh CI database.
          # Team ID comes from secrets; state UUIDs from repo variables.
          # --dolt-auto-commit on ensures each set is immediately committed to
          # HEAD so subsequent bd invocations in later steps see the config.
          BD_CFG="bd config set --dolt-auto-commit on"
          if [[ -n "$LINEAR_TEAM_ID" ]]; then
            $BD_CFG linear.team_ids "$LINEAR_TEAM_ID"
          fi
          if [[ -n "$BD_LINEAR_STATE_OPEN" ]]; then
            # Pull direction: beads status → Linear state UUID
            $BD_CFG linear.state_map.open "$BD_LINEAR_STATE_OPEN"
            $BD_CFG linear.state_map.in_progress "$BD_LINEAR_STATE_IN_PROGRESS"
            $BD_CFG linear.state_map.closed "$BD_LINEAR_STATE_CLOSED"
            # Push direction: Linear state name → beads status
            $BD_CFG linear.state_map.todo "open"
            $BD_CFG "linear.state_map.in progress" "in_progress"
            $BD_CFG linear.state_map.done "closed"
          fi
          # Priority map: 0 = No Priority, 1-4 are 1:1
          $BD_CFG linear.priority_map.0 0
          for p in 1 2 3 4; do
            $BD_CFG linear.priority_map.$p $p
          done
          $BD_CFG linear.id_mode hash
          $BD_CFG linear.hash_length 6
          echo "✔ Linear integration configured"

      - name: Detect delta and run sync
        id: sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          LINEAR_OAUTH_CLIENT_ID: ${{ secrets.LINEAR_OAUTH_CLIENT_ID }}
          LINEAR_OAUTH_CLIENT_SECRET: ${{ secrets.LINEAR_OAUTH_CLIENT_SECRET }}
          LINEAR_REPO_LABEL_ID: ${{ vars.LINEAR_REPO_LABEL_ID }}
          BTL_MAX_PUSH_DELTA: ${{ inputs.max_delta || '100' }}
        run: |
          ARGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="--dry-run"
          fi
          if [[ -n "${{ inputs.max_delta }}" ]] && [[ "${{ inputs.max_delta }}" != "100" ]]; then
            ARGS="$ARGS --max-delta ${{ inputs.max_delta }}"
          fi

          bash scripts/ci-linear-push.sh $ARGS

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_id }}
          path: .beads/sync-history/
          retention-days: 30
          if-no-files-found: ignore
